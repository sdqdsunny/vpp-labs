version: '3.8'

services:
  # VPP Master 容器 - 单独部署
  vpp-master:
    build:
      context: ./vpp-master
      dockerfile: Dockerfile
    container_name: vpp-master
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - LOG_LEVEL=INFO
      - MASTER_PORT=5000
    volumes:
      - ./vpp-master/logs:/app/logs
    networks:
      - vpp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # VPP 模拟容器 - 包含电源、储能、需求三个应用
  vpp-simulation:
    build:
      context: ./vpp-phase2-simulation
      dockerfile: Dockerfile.combined
    container_name: vpp-simulation
    ports:
      - "5001:5001"  # Power Generation
      - "5002:5002"  # Storage
      - "5003:5003"  # Demand
      - "8000:8000"  # Coordinator
    environment:
      - FLASK_ENV=production
      - LOG_LEVEL=INFO
      - POWER_PORT=5001
      - STORAGE_PORT=5002
      - DEMAND_PORT=5003
      - COORDINATOR_PORT=8000
      - MASTER_HOST=vpp-master
      - MASTER_PORT=5000
    volumes:
      - ./vpp-phase2-simulation/logs:/app/logs
      - ./vpp-phase2-simulation/data:/app/data
    networks:
      - vpp-network
    depends_on:
      vpp-master:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 可视化前端 - 可选
  vpp-visualization:
    build:
      context: ./vpp-traffic-visualization
      dockerfile: Dockerfile
    container_name: vpp-visualization
    ports:
      - "8080:80"
    environment:
      - BACKEND_HOST=vpp-master
      - BACKEND_PORT=5000
    networks:
      - vpp-network
    depends_on:
      - vpp-master
    restart: unless-stopped

networks:
  vpp-network:
    driver: bridge

volumes:
  vpp-master-logs:
  vpp-simulation-logs:
  vpp-simulation-data:
