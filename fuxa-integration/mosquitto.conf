# Mosquitto MQTT Broker Configuration
# For VPP Traffic Visualization System

# Default listener
listener 1883
protocol mqtt

# WebSocket listener for browser-based clients
listener 9001
protocol websockets

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
log_timestamp true

# Security
allow_anonymous true

# Performance tuning
max_connections -1
max_queued_messages 1000
message_size_limit 0

# Client settings
max_inflight_messages 20
