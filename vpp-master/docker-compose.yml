version: '3.8'

services:
  # VPP主站应用
  vpp-master:
    build: .
    container_name: vpp-master
    ports:
      - "8090:8080"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql://vpp:vpp@vpp-master-postgres:5432/vpp_master
      - REDIS_URL=redis://vpp-master-redis:6379/0
    depends_on:
      - vpp-master-postgres
      - vpp-master-redis
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - vpp-master-network
    restart: unless-stopped

  # PostgreSQL数据库
  vpp-master-postgres:
    image: postgres:15-alpine
    container_name: vpp-master-postgres
    environment:
      - POSTGRES_USER=vpp
      - POSTGRES_PASSWORD=vpp
      - POSTGRES_DB=vpp_master
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vpp-master-network
    restart: unless-stopped

  # Redis缓存
  vpp-master-redis:
    image: redis:7-alpine
    container_name: vpp-master-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - vpp-master-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  vpp-master-network:
    driver: bridge
