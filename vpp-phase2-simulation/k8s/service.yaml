apiVersion: v1
kind: Service
metadata:
  name: vpp-phase2-simulation
  namespace: default
  labels:
    app: vpp-phase2-simulation
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
spec:
  type: ClusterIP
  selector:
    app: vpp-phase2-simulation
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
  sessionAffinity: None
---
apiVersion: v1
kind: Service
metadata:
  name: vpp-phase2-simulation-lb
  namespace: default
  labels:
    app: vpp-phase2-simulation
spec:
  type: LoadBalancer
  selector:
    app: vpp-phase2-simulation
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  sessionAffinity: None
