version: '3.8'

services:
  # VPP Traffic Visualization Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vpp-traffic-viz-backend
    ports:
      - "5004:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_APP=app.py
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./data:/app/data
    networks:
      - vpp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Nginx reverse proxy and static file server
  nginx:
    image: nginx:alpine
    container_name: vpp-traffic-viz-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - vpp-network
    restart: unless-stopped

networks:
  vpp-network:
    driver: bridge

volumes:
  data:
    driver: local
