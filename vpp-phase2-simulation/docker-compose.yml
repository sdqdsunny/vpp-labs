version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:13-alpine
    container_name: vpp-postgres
    environment:
      POSTGRES_USER: vpp_user
      POSTGRES_PASSWORD: vpp_password
      POSTGRES_DB: vpp_phase2_sim
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpp_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vpp-network

  # Redis Cache
  redis:
    image: redis:6-alpine
    container_name: vpp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vpp-network

  # VPP Phase 2 Simulation API
  vpp-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vpp-phase2-simulation
    environment:
      ENV: development
      DEBUG: "false"
      API_HOST: 0.0.0.0
      API_PORT: 8080
      API_WORKERS: 4
      DATABASE_URL: postgresql://vpp_user:vpp_password@postgres:5432/vpp_phase2_sim
      DATABASE_POOL_SIZE: 20
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
      LOG_FILE: /app/logs/vpp_phase2_sim.log
      LOG_FORMAT: json
      PROMETHEUS_ENABLED: "true"
      PROMETHEUS_PORT: 8081
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - vpp-network

  # Prometheus Metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: vpp-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./k8s/prometheus-config.yaml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - vpp-api
    networks:
      - vpp-network

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: vpp-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./k8s/grafana-dashboards:/etc/grafana/provisioning/dashboards
      - ./k8s/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    depends_on:
      - prometheus
    networks:
      - vpp-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  vpp-network:
    driver: bridge
