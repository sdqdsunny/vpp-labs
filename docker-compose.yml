version: '3.8'

services:
  vpp-system:
    image: vpp-system:latest
    container_name: vpp-container
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - PYTHONUNBUFFERED=1
      - API_PORT=8080
      - ENV=production
      - LOG_LEVEL=INFO
    volumes:
      - ./vpp-phase2-simulation/logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
