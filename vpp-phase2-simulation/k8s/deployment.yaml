apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpp-phase2-simulation
  namespace: default
  labels:
    app: vpp-phase2-simulation
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: vpp-phase2-simulation
  template:
    metadata:
      labels:
        app: vpp-phase2-simulation
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: vpp-phase2-simulation
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: vpp-phase2-simulation
        image: vpp-phase2-simulation:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: API_HOST
          value: "0.0.0.0"
        - name: API_PORT
          value: "8080"
        - name: ENV
          value: "production"
        - name: LOG_LEVEL
          value: "INFO"
        - name: DEBUG
          value: "false"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: vpp-phase2-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: vpp-phase2-secrets
              key: redis-url
        - name: VPP_MASTER_URL
          valueFrom:
            configMapKeyRef:
              name: vpp-phase2-config
              key: vpp-master-url
        - name: VPP_MASTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: vpp-phase2-secrets
              key: vpp-master-api-key
        - name: VPP_MASTER_TIMEOUT
          value: "30"
        - name: VPP_MASTER_MAX_RETRIES
          value: "3"
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        - name: config
          mountPath: /app/config
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: logs
        emptyDir: {}
      - name: config
        configMap:
          name: vpp-phase2-config
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - vpp-phase2-simulation
              topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 30
