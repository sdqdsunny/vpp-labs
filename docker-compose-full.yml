version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: vpp-postgres
    environment:
      POSTGRES_USER: vpp_user
      POSTGRES_PASSWORD: vpp_password
      POSTGRES_DB: vpp_phase2_sim
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpp_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vpp-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: vpp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vpp-network

  # VPP 主应用
  vpp-system:
    build:
      context: .
      dockerfile: vpp-phase2-simulation/Dockerfile
    image: vpp-system:latest
    container_name: vpp-container
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - API_PORT=8080
      - API_HOST=0.0.0.0
      - ENV=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql://vpp_user:vpp_password@postgres:5432/vpp_phase2_sim
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./vpp-phase2-simulation/logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - vpp-network

volumes:
  postgres_data:
  redis_data:

networks:
  vpp-network:
    driver: bridge
