version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: vpp_postgres
    environment:
      POSTGRES_USER: vpp_user
      POSTGRES_PASSWORD: vpp_password
      POSTGRES_DB: vpp_phase2_sim
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpp_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: vpp_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # VPP Phase 2 Simulation Framework
  vpp-phase2-sim:
    build:
      context: .
      dockerfile: Dockerfile.phase2
    container_name: vpp_phase2_sim
    environment:
      ENV: development
      DEBUG: "False"
      DATABASE_URL: postgresql://vpp_user:vpp_password@postgres:5432/vpp_phase2_sim
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
      API_HOST: 0.0.0.0
      API_PORT: 8001
      VPP_MASTER_URL: http://vpp-master:8000
    ports:
      - "8001:8001"
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./vpp-phase2-simulation:/app/vpp-phase2-simulation
      - ./logs:/app/logs
    command: python3 -m vpp_phase2_simulation.app

  # Prometheus Metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: vpp_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # Grafana Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: vpp_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: vpp_network
