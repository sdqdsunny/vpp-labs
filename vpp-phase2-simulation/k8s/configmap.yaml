apiVersion: v1
kind: ConfigMap
metadata:
  name: vpp-phase2-config
  namespace: default
  labels:
    app: vpp-phase2-simulation
data:
  vpp-master-url: "http://vpp-master:8001"
  log-level: "INFO"
  api-workers: "4"
  api-timeout: "30"
  # Application configuration
  app-config.json: |
    {
      "api": {
        "host": "0.0.0.0",
        "port": 8080,
        "workers": 4,
        "timeout": 30
      },
      "database": {
        "pool_size": 10,
        "max_overflow": 20,
        "pool_recycle": 3600
      },
      "redis": {
        "max_connections": 50,
        "socket_timeout": 5
      },
      "logging": {
        "level": "INFO",
        "format": "json"
      },
      "metrics": {
        "enabled": true,
        "port": 8080,
        "path": "/metrics"
      }
    }
